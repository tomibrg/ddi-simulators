<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" role="img" aria-label="ORBITA">
  <defs>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6C48C"/>
      <stop offset="1" stop-color="#D97E2C"/>
    </linearGradient>
  </defs>
  <g transform="translate(41 32) rotate(-20)">
    <ellipse rx="34" ry="11" fill="none" stroke="#6E6A66" stroke-width="5"/>
    <circle r="22" fill="url(#planet)" transform="rotate(20)"/>
    <!-- front half of the ring, drawn over the planet -->
    <path d="M -34 0 A 34 11 0 0 0 34 0" fill="none" stroke="#FFF7ED" stroke-width="5" stroke-linecap="round"/>
    <circle cx="30" cy="-5.2" r="5" fill="#FFF7ED"/>
  </g>
  <text x="92" y="47" fill="#FFF7ED" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="7">ORBITA</text>
</svg>
